  <main>
    <div class="contact-grid reveal">
      <div class="contact-card contact-card--email">
        <a class="email-pill" href="mailto:cmapoua@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
          </svg>
          cmapoua@gmail.com

      </div>

      <div class="contact-card contact-card--github">
        <a href="https://github.com/Chrix162" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
          <h3>Profil GitHub</h3>
          <p>Retrouve tous mes dépôts</p>
        </a>
      </div>

      <div class="contact-card contact-card--linkedin">
        <a href="https://linkedin.com/in/chris-mapoua" target="_blank" rel="noopener" aria-label="Profil LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.7c0-1.36-.02-3.1-1.9-3.1-1.9 0-2.19 1.48-2.19 3v5.8H9z"/></svg>
        </a>
      </div>
    </div>

    <span class="section-eyebrow" style="margin-top: 0;">§ 05 — Contact</span>
    <h2>Discutons de ton projet.</h2>
    <p style="color: var(--line-dim); margin-bottom: 1rem;">
      Tu peux aussi me contacter directement via le formulaire ci-dessous.
    </p>

    <form class="reveal">
      <div class="field">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" placeholder="Jean Dupont" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jean.dupont@example.com" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Écris ton message ici" required></textarea>
      </div>
      <button type="submit" class="submit">Envoyer le message</button>
    </form>
  </main>

  <footer>
    <small><span id="copyright-year">2026</span> Chris Mapoua. Tous droits réservés.</small>
    <ul class="socials">
      <li><a href="https://linkedin.com/in/chris-mapoua" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">LinkedIn</a></li>
      <li><a href="https://github.com/Chrix162" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub</a></li>
      <li><a href="mailto:cmapoua@gmail.com" aria-label="Email">Email</a></li>
    </ul>
  </footer>

  <script src="script.js"></script>
